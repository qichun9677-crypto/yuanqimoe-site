eyebrow: About Genki Bloom
title: 用纸笔的温润，治愈日常的匆忙
summary: 元气萌动并不只是一个文具品牌，而是一种让记录、收纳与生活习惯重新变得有仪式感的方式。
image: /assets/images/about-hero.jpg
story_html: |
  <h2>品牌故事</h2>
  <p>在数字工具越来越密集的日常里，我们仍然相信纸张、笔尖和收纳细节拥有独特的安定感。元气萌动希望把这种细腻、轻盈、温暖的体验带回到每一次书写、整理和送礼场景中。</p>
  <p>这份 GitHub Pages 站点包将静态原型拆分成了可编辑的数据结构，让内容运营和视觉表达能够继续并行演进。</p>
