---
layout: default
---
<section class="shell detail-layout">
  <div class="detail-media">
    <img src="{{ page.image | relative_url }}" alt="{{ page.title }}">
  </div>
  <div class="detail-copy card">
    <div class="meta-kicker">{{ page.category }}</div>
    <h1>{{ page.title }}</h1>
    <p class="lede">{{ page.teaser }}</p>
    <div class="detail-panels">
      <div class="note">参考价格：{{ page.price }}</div>
    </div>
    <div class="button-row">
      <a class="button" href="{{ '/products/' | relative_url }}">返回产品页</a>
      <a class="button button-secondary" href="{{ '/about/' | relative_url }}">了解品牌</a>
    </div>
  </div>
</section>

<section class="shell section detail-content">
  <div class="page-card rich-text">
    {{ content }}
  </div>
</section>
